name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # the pictures under 使用情境 are drawn by this script; the data file has to be what it draws
      - run: python3 scripts/hero-figures.py --check
      # the notes on sites in inspection reports: their format, categories, domains, sources, and a review within the year
      - run: node scripts/site-notes.mjs
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:onion

  # a third of the browser tests each, side by side; Playwright builds and serves both sites itself (playwright.config.ts)
  web-test:
    name: web test (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --shard=${{ matrix.shard }}/3

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.7-alpine3.24
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: vessel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      VESSEL_TEST_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/vessel
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q
      # as deploy/docker-compose.yml runs it: uid 10001, read-only files, no capabilities. It imports, migrates the
      # test database, starts ssh, cannot write to its own files, and has no pip or uv to install anything with
      - name: api image
        run: |
          docker build -q -t vessel-api .
          docker run --rm --network host --read-only --tmpfs /tmp:size=64m,mode=1777,noexec,nosuid,nodev \
            --cap-drop ALL --security-opt no-new-privileges:true -e VESSEL_DATABASE_URL="$VESSEL_TEST_DATABASE_URL" -e VESSEL_ACCOUNT_PEPPER=test-pepper -e VESSEL_HMAC_KEY=test-hmac-key \
            vessel-api sh -c '[ "$(id -u)" = 10001 ] && python -c "import app.main, app.worker, app.admin" \
              && python -m app.migrate && ssh -V && ! touch /app/app/x 2>/dev/null && ! ls app/__pycache__ | grep -v cpython-315 \
              && ! python -m pip --version 2>/dev/null && ! command -v uv'
      # ssh through a jump host leaves its ProxyCommand for PID 1 to reap: compose gives the API and the worker an init
      - name: api and worker reap ssh's leftovers
        run: bash ../deploy/test/reap-test.sh vessel-api

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shell syntax
        run: for f in node/*.sh node/host/vessel-inspect-stream.sh node/host/vessel-inspect-confirm.sh node/awgctl node/test/*.sh deploy/rpz/*.sh deploy/rpz/test/*.sh deploy/test/*.sh tools/host-sbom/*.sh; do bash -n "$f"; done
      - name: shellcheck
        run: shellcheck -S warning -x node/*.sh node/host/vessel-inspect-stream.sh node/host/vessel-inspect-confirm.sh node/awgctl node/test/*.sh deploy/rpz/*.sh deploy/rpz/test/*.sh deploy/test/*.sh tools/host-sbom/*.sh
      # block entries only, no shared names
      - name: blocklists
        run: bash deploy/rpz/test/lists-test.sh
      # earlier lists leave later ones lighter and change nothing else; failures keep the previous list
      - name: build the zones
        run: bash deploy/rpz/test/build-zones-test.sh
      # concurrent adds, a failed apply tried again, flows of a reused address
      - name: awgctl
        run: bash node/test/awgctl-test.sh
      # the stream follows a recreated container instead of staying in its old network namespace
      - name: inspect stream
        run: bash node/test/inspect-stream-test.sh
      # the values that stay clear of two open upstream defects
      - name: AmneziaWG parameters
        run: bash node/test/awg-params-test.sh
      # only the lists that changed are transferred
      - name: pull-lists
        run: bash node/test/pull-lists-test.sh
      # upstream's image and the module the daemon is built from name the same AmneziaWG
      - name: AmneziaWG version
        run: bash node/test/awg-version-test.sh
      # the daemon from source: the tests of its packages run inside the build (node/Dockerfile)
      - name: node image
        run: docker build -q node
      # the container with only the capabilities run.sh grants comes up, and awgctl can still do its work in it
      - name: node container capabilities
        run: bash node/test/caps-test.sh
      # load onto nodes, check it is the same image, leave the switch-over to the maintainer
      - name: image.sh
        run: bash node/test/image-test.sh
      # every file of node/ is in files.tsv, which drift-check.sh reads
      - name: files.tsv
        run: bash node/test/files-test.sh
      # deploy.sh against a stand-in node, in a throwaway container where /opt and /etc are disposable
      - name: deploy.sh
        run: docker run --rm -v "$PWD:/repo:ro" debian:stable-slim bash /repo/node/test/deploy-test.sh /repo
      # one device over the limit is refused, another device is not
      - name: device connection limit
        run: sudo bash node/test/device-limit-test.sh
      # a device that changed address within the hour is not counted as a probe; someone imitating a handshake is
      # the SBOM of a container's image, read over a stand-in ssh
      - name: host SBOM
        run: bash tools/host-sbom/test.sh
      - name: probe watch
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq nftables
          sudo bash node/test/probe-watch-test.sh

  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install
        run: pip install cryptography
      - name: unit tests
        run: python3 -m unittest discover -s inspect/tests
      - name: shellcheck
        run: shellcheck -S warning inspect/inspect-remote

  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: shellcheck -S warning relay/vessel-relay relay/test/netns-test.sh
      - name: nftables
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nftables
      # a device, the entry and a node in network namespaces, with real UDP through the entry
      - name: forward through the entry
        run: sudo bash relay/test/netns-test.sh
