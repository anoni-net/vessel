name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # the pictures under 使用情境 are drawn by this script; the data file has to be what it draws
      - run: python3 scripts/hero-figures.py --check
      # the notes on sites in inspection reports: their format, categories, domains, sources, and a review within the year
      - run: node scripts/site-notes.mjs
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:onion
      - run: npx playwright install --with-deps chromium
      - run: npm test

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: vessel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      VESSEL_TEST_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/vessel
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shell syntax
        run: for f in node/*.sh node/host/vessel-inspect-stream.sh node/host/vessel-inspect-confirm.sh node/awgctl node/test/*.sh deploy/rpz/*.sh deploy/rpz/test/*.sh; do bash -n "$f"; done
      - name: shellcheck
        run: shellcheck -S warning -x node/*.sh node/host/vessel-inspect-stream.sh node/host/vessel-inspect-confirm.sh node/awgctl node/test/*.sh deploy/rpz/*.sh deploy/rpz/test/*.sh
      # block entries only, no shared names
      - name: blocklists
        run: bash deploy/rpz/test/lists-test.sh
      # earlier lists leave later ones lighter and change nothing else; failures keep the previous list
      - name: build the zones
        run: bash deploy/rpz/test/build-zones-test.sh
      # concurrent adds, a failed apply tried again, flows of a reused address
      - name: awgctl
        run: bash node/test/awgctl-test.sh
      # only the lists that changed are transferred
      - name: pull-lists
        run: bash node/test/pull-lists-test.sh
      # one device over the limit is refused, another device is not
      - name: device connection limit
        run: sudo bash node/test/device-limit-test.sh

  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: install
        run: pip install cryptography
      - name: unit tests
        run: python3 -m unittest discover -s inspect/tests
      - name: shellcheck
        run: shellcheck -S warning inspect/inspect-remote

  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: shellcheck
        run: shellcheck -S warning relay/vessel-relay relay/test/netns-test.sh
      - name: nftables
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nftables
      # a device, the entry and a node in network namespaces, with real UDP through the entry
      - name: forward through the entry
        run: sudo bash relay/test/netns-test.sh
