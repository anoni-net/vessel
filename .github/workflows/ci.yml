name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # the pictures under 使用情境 are drawn by this script; the data file has to be what it draws
      - run: python3 scripts/hero-figures.py --check
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:onion
      - run: npx playwright install --with-deps chromium
      - run: npm test

  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine3.24
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: vessel
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 15
    env:
      VESSEL_TEST_DATABASE_URL: postgresql://postgres:test@127.0.0.1:5432/vessel
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q

  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shell syntax
        run: for f in node/*.sh node/awgctl node/test/*.sh; do bash -n "$f"; done
      - name: shellcheck
        run: shellcheck -S warning node/*.sh node/awgctl node/test/*.sh
      # concurrent adds, a failed apply tried again, flows of a reused address
      - name: awgctl
        run: bash node/test/awgctl-test.sh

  relay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: shellcheck -S warning relay/vessel-relay relay/test/netns-test.sh
      - name: nftables
        run: sudo apt-get update -qq && sudo apt-get install -y -qq nftables
      # a device, the entry and a node in network namespaces, with real UDP through the entry
      - name: forward through the entry
        run: sudo bash relay/test/netns-test.sh
