name: SBOM

# What Vessel is made of, as CycloneDX: the lockfiles of the code, build tools included (source), the images the
# hosts build from this repo (api, node, rpz), and the images the deployment pulls as they are (postgres, the Zeek of
# inspect/, the Node.js that deploy.sh builds the web with). A scan of the repo alone reads only the lockfiles, so the
# images are built and pulled here.
#
# Only the source SBOM is kept, as a workflow artifact for 90 days: the lockfiles are public anyway. The images'
# SBOMs stay inside the run, and so does what Grype finds in them. The node image installs Alpine's packages with apk
# at build time, so a node rebuilt on another day can hold newer packages than these; tools/host-sbom reads what a
# host actually runs.
#
# Once a week, and by hand, Grype compares every SBOM with the vulnerability databases and lists what has a fixed
# version in the repository's code scanning alerts (Security tab, maintainers only), so a new advisory is noticed
# even when nobody pushes. Alerts that do not apply, such as the Go runtime inside postgres's gosu, are dismissed
# there once and stay dismissed. Other pull requests do not run this: a CVE published today has nothing to do with
# them. A pull request that changes this file runs it all except the upload to code scanning.

on:
  push:
    branches: [main]
  pull_request:
    paths: [.github/workflows/sbom.yml]
  schedule:
    - cron: "41 2 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        id: syft
      - name: build the images
        run: |
          docker build -q -t vessel-api api
          docker build -q -t vessel-node node
          docker build -q -t vessel-rpz deploy/rpz
      - name: write the SBOMs
        env:
          SYFT: ${{ steps.syft.outputs.cmd }}
          # packages only; the list of every file in an image adds thousands of entries and no vulnerability
          SYFT_FILE_METADATA_SELECTION: none
          # vite and the rest run on the portal's host at every deploy (deploy/deploy.sh)
          SYFT_JAVASCRIPT_INCLUDE_DEV_DEPENDENCIES: "true"
        run: |
          set -euo pipefail
          mkdir sbom images
          "$SYFT" scan dir:. --source-name vessel --source-version "$GITHUB_SHA" -o cyclonedx-json=sbom/source.cdx.json
          for name in api node rpz; do
            "$SYFT" scan "docker:vessel-$name" --source-name "vessel-$name" --source-version "$GITHUB_SHA" -o "cyclonedx-json=images/image-$name.cdx.json"
          done
          # the images fixed by digest outside a Dockerfile; Dependabot proposes updates for none of the last two
          refs=$(grep -ohE '[a-z0-9][a-z0-9./_-]*(:[A-Za-z0-9._-]+)?@sha256:[0-9a-f]{64}' deploy/docker-compose.yml inspect/analyze.py deploy/deploy.sh | sort -u)
          [ "$(echo "$refs" | wc -l)" -eq 3 ] || { echo "expected three pulled images, found:"; echo "$refs"; exit 1; }
          for ref in $refs; do
            name=$(echo "${ref%%[:@]*}" | tr / -)
            "$SYFT" scan "registry:$ref" -o "cyclonedx-json=images/pulled-$name.cdx.json"
          done
          ls -l sbom images
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sbom-${{ github.sha }}
          path: sbom/source.cdx.json
          retention-days: 90
      - uses: anchore/scan-action/download-grype@27805bf3b4e84b4a5c980df22ed233c00390a439 # v7.4.2
        if: github.event_name != 'push'
        id: grype
      - name: known vulnerabilities
        if: github.event_name != 'push'
        env:
          GRYPE: ${{ steps.grype.outputs.cmd }}
        run: |
          set -euo pipefail
          mkdir sarif
          for f in sbom/*.cdx.json images/*.cdx.json; do
            name=$(basename "$f" .cdx.json)
            # into a file only: the run's log is public, the findings go to the Security tab
            "$GRYPE" "sbom:$f" --only-fixed -o "sarif=$RUNNER_TEMP/$name.sarif"
            # one category per file, or code scanning would take each upload as replacing the last
            jq --arg id "grype/$name/" '.runs[].automationDetails.id = $id' "$RUNNER_TEMP/$name.sarif" > "sarif/$name.sarif"
            echo "$name: $(jq '[.runs[].results[]] | length' "sarif/$name.sarif") findings"
          done
      - uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        with:
          sarif_file: sarif/
