# Portal backend on the web host. nginx serves web/dist and forwards /api/ to 127.0.0.1:8090.
# Copy .env.example to .env next to this file and fill it in.
services:
  db:
    image: postgres:18.6-alpine3.24
    restart: unless-stopped
    environment:
      POSTGRES_DB: vessel
      POSTGRES_USER: vessel
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes:
      - db:/var/lib/postgresql
    logging:
      driver: json-file
      options: { max-size: "1m", max-file: "2" }

  api:
    build: ../api
    restart: unless-stopped
    depends_on: [db]
    environment: &env
      VESSEL_DATABASE_URL: postgresql://vessel:${POSTGRES_PASSWORD}@db/vessel
      VESSEL_ACCOUNT_PEPPER: ${VESSEL_ACCOUNT_PEPPER:?}
      VESSEL_HMAC_KEY: ${VESSEL_HMAC_KEY:?}
      VESSEL_SSH_KEY: /run/vessel-ssh/key
      VESSEL_SSH_KNOWN_HOSTS: /run/vessel-ssh/known_hosts
    # the portal's SSH key (pinned to awgctl-remote on every node) and the nodes' host keys
    volumes: &ssh
      - ./ssh:/run/vessel-ssh:ro
    ports:
      - "127.0.0.1:8090:8090"
    logging: &logging
      driver: json-file
      options: { max-size: "1m", max-file: "2" }

  # runs queued node jobs, expires devices and clears unfetched configs every 10 seconds
  worker:
    build: ../api
    restart: unless-stopped
    depends_on: [db]
    command: ["python", "-m", "app.worker"]
    environment: *env
    volumes: *ssh
    logging: *logging

volumes:
  db:
