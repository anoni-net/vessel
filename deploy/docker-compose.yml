# Portal backend on the web host. nginx serves the built web/ and forwards /api/ to 127.0.0.1:${VESSEL_API_PORT}.
#
# Secrets live in /etc/vessel/, outside the app directory, so the host's backups of the app directory and of
# the database dumps never hold the account pepper and HMAC key next to the data (see README.md).
#   /etc/vessel/db.env    POSTGRES_PASSWORD
#   /etc/vessel/api.env   VESSEL_DATABASE_URL, VESSEL_ACCOUNT_PEPPER, VESSEL_HMAC_KEY
#   /etc/vessel/ssh/      key and known_hosts for reaching the nodes' awgctl-remote, owned by the API's uid (10001,
#                         api/Dockerfile) so that it can read them: deploy.sh sets this
name: vessel

services:
  db:
    image: postgres:19.0-alpine3.24@sha256:cac45fb483caee3668946088a1c0532db89d5285c28dbfeac889b4068296e06f
    restart: unless-stopped
    environment:
      POSTGRES_DB: vessel
      POSTGRES_USER: vessel
    env_file: /etc/vessel/db.env
    # as postgres (uid 70 in the image) from the start, so the entrypoint needs none of root's capabilities to chown and
    # drop privileges: the data directory and the socket's are already postgres's
    user: "70:70"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - db:/var/lib/postgresql
    # a fresh database takes a few seconds to initialize; migrations and the API wait for it
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vessel -d vessel"]
      interval: 2s
      timeout: 3s
      retries: 30
    logging: &logging
      driver: json-file
      options: { max-size: "1m", max-file: "2" }

  api:
    build: ../api
    restart: unless-stopped
    depends_on: &db
      db:
        condition: service_healthy
    env_file: &env /etc/vessel/api.env
    environment: &paths
      VESSEL_SSH_KEY: /run/vessel-ssh/key
      VESSEL_SSH_KNOWN_HOSTS: /run/vessel-ssh/known_hosts
    volumes: &ssh
      - /etc/vessel/ssh:/run/vessel-ssh:ro
    ports:
      - "127.0.0.1:${VESSEL_API_PORT:-8090}:8090"
    # the host is shared with other services. The API holds the blocklists and the address table in memory (about
    # 300 MB, twice that while they are refreshed) and hashes a few account numbers at once (app/crypto.py); past this
    # it is restarted instead of taking the host's memory
    mem_limit: 2g
    # neither the API nor the worker needs any of root's capabilities: they listen on a high port, read their own
    # files and start ssh. Without them, a way into the process is a smaller step towards the host
    cap_drop: &caps [ALL]
    security_opt: &nonew ["no-new-privileges:true"]
    # they run as an unprivileged user (api/Dockerfile) and write nothing to their own files: the code, the packages
    # and the compiled .pyc are read-only, and only /tmp is writable, in memory, with nothing in it run
    read_only: true
    tmpfs: &tmp ["/tmp:size=64m,mode=1777,noexec,nosuid,nodev"]
    # ssh through a jump host (app/nodes.py) leaves its ProxyCommand behind when it exits, for PID 1 to reap. Python
    # as PID 1 never does, so each such call left a zombie (the worker reads a probe control every 30 minutes). Docker's
    # init runs as PID 1 instead and reaps them (deploy/test/reap-test.sh)
    init: true
    logging: *logging

  # runs queued node jobs, expires devices, clears unfetched configs, polls usage and enforces the quota
  worker:
    build: ../api
    restart: unless-stopped
    depends_on: *db
    command: ["python", "-m", "app.worker"]
    env_file: *env
    environment: *paths
    volumes: *ssh
    cap_drop: *caps
    security_opt: *nonew
    read_only: true
    tmpfs: *tmp
    init: true
    logging: *logging

volumes:
  db:
