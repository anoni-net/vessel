# DNS filter check for https://vessel.anoni.net/dns/. The page fetches /check from each name; Vessel's resolvers
# answer some of the names with NXDOMAIN (node/unbound/*.conf), so the requests that fail show which filter is
# in effect. Each name is a proxied CNAME to this host on Cloudflare. Nothing here is logged.
server {
    listen 443 ssl;
    http2 on;
    server_name vessel-dns-0.anoni.net vessel-dns-1.anoni.net vessel-dns-2.anoni.net vessel-dns-3.anoni.net;

    ssl_certificate     /etc/ssl/vessel/origin.pem;
    ssl_certificate_key /etc/ssl/vessel/origin.key;

    include /etc/nginx/snippets/cloudflare-allow.conf;

    access_log off;

    location = /check {
        # only the Vessel page may read the answer
        add_header Access-Control-Allow-Origin "https://vessel.anoni.net" always;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 404;
    }
}
