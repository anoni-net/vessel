# Example vhost for the onion site, vessel.<onion> (anoni-net/vessel#147): the build of VESSEL_TARGET=onion in
# /srv/vessel/web-onion. Tor hands the connections to nginx on a unix socket (HiddenServicePort 80 unix:...), so
# nothing here passes Cloudflare and there is no visitor address to go by.

# The API rate-limits sign-in by CF-Connecting-IP. Every onion visitor gets the same value, so they share one
# allowance; on top of that nginx caps all the writes that come over Tor together. Reading is not limited.
map $request_method $vessel_onion_write {
    GET     "";
    HEAD    "";
    default "vessel-onion";
}
limit_req_zone $vessel_onion_write zone=vessel_onion_writes:1m rate=30r/m;

server {
    listen unix:/var/run/tor-sitepad-anoni.sock;
    server_name vessel.anoninetru5tflukgfaehun7q6khowgmymcff3gtk5oyesqazhmfxtyd.onion;

    root /srv/vessel/web-onion;
    index index.html;

    # the portal keeps no record of visitors (#433)
    access_log off;

    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-store" always;
    # only this site's own files and API, and the form server's onion address; nothing on clearnet
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self' http://form.anoninetru5tflukgfaehun7q6khowgmymcff3gtk5oyesqazhmfxtyd.onion/api/v1/client/cmc9borto0008lj014bq33jqq/responses; manifest-src 'self'; font-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    location /api/ {
        limit_req zone=vessel_onion_writes burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8090;    # deploy/.env VESSEL_API_PORT
        proxy_set_header Host $host;
        proxy_set_header CF-Connecting-IP onion;
    }

    # the logo, flags and favicon: the same files as https://assets.anoni.net/vessel/ (web/src/images.ts)
    location /vessel-assets/ {
        alias /srv/images-anoni-net/vessel/;
    }

    location / {
        try_files $uri $uri/index.html =404;
    }
    error_page 404 /404.html;
}
