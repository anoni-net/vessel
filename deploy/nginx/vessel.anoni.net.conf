# Example vhost. Cloudflare sits in front; the TLS certificate here is the origin certificate.
server {
    listen 443 ssl;
    http2 on;
    server_name vessel.anoni.net;

    # the Cloudflare origin certificate for *.anoni.net
    ssl_certificate     /etc/ssl/vessel/origin.pem;
    ssl_certificate_key /etc/ssl/vessel/origin.key;

    # Only Cloudflare (and the tailnet) may connect. The API rate-limits by CF-Connecting-IP, which is only
    # trustworthy when nobody can reach the origin around Cloudflare.
    include /etc/nginx/snippets/cloudflare-allow.conf;

    root /srv/vessel/web;
    index index.html;

    # the portal keeps no record of visitors (#433)
    access_log off;

    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-store" always;
    # only this site's own files and API; nothing from third parties, no framing
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self' https://aa.anoni.net/api/send; manifest-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'" always;
    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8090;    # deploy/.env VESSEL_API_PORT
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # client-side routes, with or without a language prefix
    location / {
        try_files $uri $uri/ /index.html;
    }
}
