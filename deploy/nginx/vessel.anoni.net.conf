# Example vhost. Cloudflare sits in front; the TLS certificate here is the origin certificate.
server {
    listen 443 ssl;
    http2 on;
    server_name vessel.anoni.net;

    ssl_certificate     /etc/ssl/vessel/origin.pem;
    ssl_certificate_key /etc/ssl/vessel/origin.key;

    root /srv/vessel/web;
    index index.html;

    # the portal keeps no record of visitors (#433)
    access_log off;

    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Cache-Control "no-store" always;

    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # client-side routes, with or without a language prefix
    location / {
        try_files $uri $uri/ /index.html;
    }
}
