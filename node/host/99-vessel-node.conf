# Vessel node: host settings, installed as /etc/sysctl.d/99-vessel-node.conf (node/README.md「主機的調校」)

# The resolvers hold the blocklists in memory (about 800 MB together). Keep them out of swap, or a lookup
# can stall while the pages come back.
vm.swappiness = 10

# Per-flow fair queueing for interfaces created from now on; vessel-net-tune.sh sets it on the uplink.
net.core.default_qdisc = fq_codel
