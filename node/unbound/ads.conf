# Vessel resolver "ads" on 10.8.1.254. No query logging.
server:
  interface: 10.8.1.254
  port: 53
  do-ip6: no
  access-control: 0.0.0.0/0 refuse
  access-control: 10.8.1.0/24 allow
  username: "unbound"
  chroot: ""
  directory: "/etc/unbound"
  pidfile: "/run/unbound-ads.pid"
  auto-trust-anchor-file: "/var/lib/unbound/root-ads.key"
  verbosity: 0
  log-queries: no
  log-replies: no
  log-servfail: no
  use-syslog: no
  logfile: ""
  hide-identity: yes
  hide-version: yes
  qname-minimisation: yes
  harden-glue: yes
  harden-dnssec-stripped: yes
  aggressive-nsec: yes
  prefetch: yes
  num-threads: 1
  so-reuseport: no
  msg-cache-size: 16m
  rrset-cache-size: 32m
  private-address: 10.0.0.0/8
  private-address: 172.16.0.0/12
  private-address: 192.168.0.0/16
  private-address: 169.254.0.0/16
  private-address: 100.64.0.0/10
  module-config: "respip validator iterator"
  # DNS filter check on https://vessel.anoni.net/dns/: every Vessel resolver hides vessel-dns-1, the
  # malware filter also vessel-dns-2, the ad filter also vessel-dns-3. vessel-dns-0 always resolves.
  local-zone: "vessel-dns-1.anoni.net." always_nxdomain
  local-zone: "vessel-dns-2.anoni.net." always_nxdomain
  local-zone: "vessel-dns-3.anoni.net." always_nxdomain
  # Firefox turns off the DNS over HTTPS it enables by default when this name does not resolve (checked at
  # startup and on every network change), so its lookups keep coming here and the filter applies. Not on the
  # no-filter resolver: the signal means "this network filters".
  local-zone: "use-application-dns.net." always_nxdomain

rpz:
  name: malware.rpz.vessel
  zonefile: "/etc/unbound/rpz/malware.rpz"
  rpz-log: no
  # clears RA in what this list blocks, so start.sh can count the blocks per device without logging names
  rpz-signal-nxdomain-ra: yes

rpz:
  name: ads.rpz.vessel
  zonefile: "/etc/unbound/rpz/ads.rpz"
  rpz-log: no
