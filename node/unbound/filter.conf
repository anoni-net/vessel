# Vessel resolver "filter" on 10.8.1.253 (block malware) and 10.8.1.254 (block malware, ads and trackers). One
# unbound for both, so the lists they share are loaded once (toomore/anoni-net-ws#447): each list is tagged with
# the addresses it applies to. No query logging.
server:
  interface: 10.8.1.253
  interface: 10.8.1.254
  port: 53
  do-ip6: no
  # Who may ask is set per address, not with access-control: unbound reads an access-control entry that matches
  # the client before the interface's settings, and the tags below would never apply. Only the tunnel reaches
  # these addresses (start.sh).
  interface-action: 10.8.1.253 allow
  interface-action: 10.8.1.254 allow
  define-tag: "malware ads"
  interface-tag: 10.8.1.253 "malware"
  interface-tag: 10.8.1.254 "ads"
  username: "unbound"
  chroot: ""
  directory: "/etc/unbound"
  pidfile: "/run/unbound-filter.pid"
  auto-trust-anchor-file: "/var/lib/unbound/root-filter.key"
  verbosity: 0
  log-queries: no
  # totals only (queries per type, answers per RPZ action): how much a list blocks, never which names
  extended-statistics: yes
  log-replies: no
  log-servfail: no
  use-syslog: no
  logfile: ""
  hide-identity: yes
  hide-version: yes
  qname-minimisation: yes
  harden-glue: yes
  harden-dnssec-stripped: yes
  aggressive-nsec: yes
  prefetch: yes
  # Many sites set TTLs of a minute or less, so a cached answer is gone by the next visit and every lookup
  # goes out again. Keep answers at least 5 minutes, and once one has expired, answer with it at once while
  # fetching a fresh one in the background (RFC 8767), so the next lookup gets the new answer.
  cache-min-ttl: 300
  serve-expired: yes
  serve-expired-ttl: 86400
  serve-expired-client-timeout: 0
  num-threads: 1
  so-reuseport: no
  # the two resolvers' caches together
  msg-cache-size: 32m
  rrset-cache-size: 64m
  private-address: 10.0.0.0/8
  private-address: 172.16.0.0/12
  private-address: 192.168.0.0/16
  private-address: 169.254.0.0/16
  private-address: 100.64.0.0/10
  module-config: "respip validator iterator"
  # for the forward-zone below; read only when unbound starts, so a HUP does not pick up a change here
  tls-cert-bundle: /etc/ssl/certs/ca-certificates.crt
  # DNS filter check on https://vessel.anoni.net/dns/: every Vessel resolver hides vessel-dns-1, the
  # malware filter also vessel-dns-2, the ad filter also vessel-dns-3. vessel-dns-0 always resolves.
  # A tagged local zone answers only on the addresses with that tag.
  local-zone: "vessel-dns-1.anoni.net." always_nxdomain
  local-zone: "vessel-dns-2.anoni.net." always_nxdomain
  local-zone-tag: "vessel-dns-2.anoni.net." "malware ads"
  local-zone: "vessel-dns-3.anoni.net." always_nxdomain
  local-zone-tag: "vessel-dns-3.anoni.net." "ads"
  # Firefox turns off the DNS over HTTPS it enables by default when this name does not resolve (checked at
  # startup and on every network change), so its lookups keep coming here and the filter applies. Not on the
  # no-filter resolver: the signal means "this network filters".
  local-zone: "use-application-dns.net." always_nxdomain
  local-zone-tag: "use-application-dns.net." "malware ads"
  # the target of the ad list's CNAME: answered here, never asked of the root servers
  local-zone: "blocked.vessel." always_nxdomain

# The blocklists: the rpz: clauses are in a file of their own, with the primary's address, which is not in the repo
include: "/etc/unbound/conf.d/rpz-zones.conf"

# What the lists do not block goes to Quad9, which answers NXDOMAIN for what its threat feeds block. Over TLS, so the
# network around the node does not see the names; Quad9 sees the node's address, not the device's. If Quad9 cannot be
# reached, forward-first resolves directly after a minute or two, and the lists and DNSSEC validation still apply. Keep
# the validator: without it, forward-first takes Quad9's SERVFAIL for a bogus name as a failure and returns the forged
# answer. With it, a signed name Quad9 blocks comes back unsigned and fails validation: SERVFAIL, which is still blocked.
# A name Quad9 blocks by mistake: add a forward-zone for it above this one, to 9.9.9.10@853#dns10.quad9.net (unfiltered).
forward-zone:
  name: "."
  forward-tls-upstream: yes
  forward-first: yes
  forward-addr: 9.9.9.9@853#dns.quad9.net
  forward-addr: 149.112.112.112@853#dns.quad9.net

# a local socket for pull-lists.sh, which asks the primary for what changed (auth_zone_transfer) instead of
# restarting the resolver; only root inside the container can open it
remote-control:
  control-enable: yes
  control-interface: /run/unbound-filter.ctl
