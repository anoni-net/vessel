# The upstream of the filter resolver on the Taipei node (DNS_FORWARD=cloudflare), included by filter.conf. Quad9's
# anycast takes that node to Singapore; Cloudflare answers from Taipei (2026-11-09). 1.1.1.2 is Cloudflare's resolver
# that blocks malware, the counterpart of Quad9's 9.9.9.9. Over TLS, as with Quad9: Cloudflare sees the node's address,
# not the device's. A name it blocks comes back as 0.0.0.0 with NOERROR, not NXDOMAIN (measured on the Taipei node
# 2026-11-17), so the device list's blocked count does not include it. A signed name it blocks fails validation:
# SERVFAIL, still blocked. A name it blocks by mistake: add a forward-zone for it to 1.1.1.1@853#cloudflare-dns.com
# (unfiltered).
forward-zone:
  name: "."
  forward-tls-upstream: yes
  forward-first: yes
  forward-addr: 1.1.1.2@853#security.cloudflare-dns.com
  forward-addr: 1.0.0.2@853#security.cloudflare-dns.com
