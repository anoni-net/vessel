# Vessel resolver "none" on 10.8.1.1. No query logging.
server:
  interface: 10.8.1.1
  port: 53
  do-ip6: no
  access-control: 0.0.0.0/0 refuse
  access-control: 10.8.1.0/24 allow
  username: "unbound"
  chroot: ""
  directory: "/etc/unbound"
  pidfile: "/run/unbound-none.pid"
  auto-trust-anchor-file: "/var/lib/unbound/root-none.key"
  verbosity: 0
  log-queries: no
  # totals only (queries per type, answers per RPZ action): how much a list blocks, never which names
  extended-statistics: yes
  log-replies: no
  log-servfail: no
  use-syslog: no
  logfile: ""
  hide-identity: yes
  hide-version: yes
  qname-minimisation: yes
  harden-glue: yes
  harden-dnssec-stripped: yes
  aggressive-nsec: yes
  prefetch: yes
  # Many sites set TTLs of a minute or less, so a cached answer is gone by the next visit and every lookup
  # goes out again. Keep answers at least 5 minutes, and once one has expired, answer with it at once while
  # fetching a fresh one in the background (RFC 8767), so the next lookup gets the new answer.
  cache-min-ttl: 300
  serve-expired: yes
  serve-expired-ttl: 86400
  serve-expired-client-timeout: 0
  num-threads: 1
  so-reuseport: no
  msg-cache-size: 16m
  rrset-cache-size: 32m
  private-address: 10.0.0.0/8
  private-address: 172.16.0.0/12
  private-address: 192.168.0.0/16
  private-address: 169.254.0.0/16
  private-address: 100.64.0.0/10
  # the device itself, and the same ranges written as IPv6: a site's name answering with one of these would have the
  # browser talk to a service on the device or its network in the site's name
  private-address: 127.0.0.0/8
  private-address: ::1/128
  private-address: fc00::/7
  private-address: fe80::/10
  private-address: ::ffff:0:0/96
  module-config: "validator iterator"
  # DNS filter check on https://vessel.anoni.net/dns/: every Vessel resolver hides vessel-dns-1, the
  # malware filter also vessel-dns-2, the ad filter also vessel-dns-3. vessel-dns-0 always resolves.
  # the confirmation page of a device inspection, on this node (host/vessel-inspect-confirm.py)
  local-data: "confirm.vessel.anoni.net. 60 IN A 10.8.1.1"
  local-zone: "vessel-dns-1.anoni.net." always_nxdomain
